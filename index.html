<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>octopi my heart</title>
  <link rel="stylesheet" href="style.css?v=16">
</head>
<body>
  <div class="game-container">
    <div class="title-card" id="titleCard">
      <h1>octopi <em>my</em> heart</h1>
      <div><span id="moveHint">press arrow keys to move</span><span>three tiny levels</span></div>
    </div>
    <div class="ui-panel">
      <div class="level-copy">
        <div class="objective" id="objective">Reach the blue octopus</div>
        <div class="status" id="status"></div>
      </div>
      <div class="timer" id="timer">6.0</div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <button class="audio-toggle" id="audioToggle" type="button" aria-pressed="false">sound on</button>
    <div class="mobile-dpad" id="mobileDpad" aria-label="Movement controls">
      <button class="dpad-up" type="button" data-direction="up" aria-label="Move up">↑</button>
      <button class="dpad-left" type="button" data-direction="left" aria-label="Move left">←</button>
      <button class="dpad-down" type="button" data-direction="down" aria-label="Move down">↓</button>
      <button class="dpad-right" type="button" data-direction="right" aria-label="Move right">→</button>
    </div>
    <div class="replay-label" id="replayLabel" aria-live="polite"></div>
    <div class="final-card" id="finalCard" aria-live="polite">
      <p>you octopi my heart.</p>
      <button type="button" id="shareButton">share this with someone</button>
    </div>
    <div class="reveal-overlay" id="revealOverlay">
      <div class="reveal-message" id="revealMessage"></div>
    </div>
  </div>
  <script src="game.js?v=17"></script>
</body>
</html>
